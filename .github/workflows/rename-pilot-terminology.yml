name: Rename pilot terminology

on:
  push:
    branches:
      - dns-pc-ai-consultant
    paths:
      - .github/workflows/rename-pilot-terminology.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dns-pc-ai-consultant
      - name: Replace educational terminology
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              ('Учебного задания', 'Пилотного проекта'),
              ('учебного задания', 'пилотного проекта'),
              ('Учебной работы', 'Пилотного проекта'),
              ('учебной работы', 'пилотного проекта'),
              ('Учебный', 'Пилотный'),
              ('учебный', 'пилотный'),
              ('Учебная', 'Пилотная'),
              ('учебная', 'пилотная'),
              ('Учебное', 'Пилотное'),
              ('учебное', 'пилотное'),
              ('Учебного', 'Пилотного'),
              ('учебного', 'пилотного'),
              ('Учебной', 'Пилотной'),
              ('учебной', 'пилотной'),
              ('Учебном', 'Пилотном'),
              ('учебном', 'пилотном'),
              ('Учебному', 'Пилотному'),
              ('учебному', 'пилотному'),
          ]
          allowed = {'.md', '.txt', '.js', '.html', '.json', '.yml', '.yaml'}
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in allowed:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('Changed files:')
          print('\n'.join(changed) if changed else 'none')
          PY
      - name: Commit terminology update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace educational branding with pilot branding"
          git push origin HEAD:dns-pc-ai-consultant
