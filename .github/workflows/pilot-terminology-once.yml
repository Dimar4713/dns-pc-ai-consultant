name: One-time pilot terminology migration

on:
  push:
    branches:
      - dns-pc-ai-consultant
    paths:
      - .github/workflows/pilot-terminology-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dns-pc-ai-consultant
      - name: Update terminology in project files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          u = "\u0443\u0447\u0435\u0431"
          p = "\u043f\u0438\u043b\u043e\u0442"
          replacements = [
              (u.capitalize() + "\u043d\u043e\u0433\u043e \u0437\u0430\u0434\u0430\u043d\u0438\u044f", p.capitalize() + "\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0435\u043a\u0442\u0430"),
              (u + "\u043d\u043e\u0433\u043e \u0437\u0430\u0434\u0430\u043d\u0438\u044f", p + "\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0435\u043a\u0442\u0430"),
              (u.capitalize() + "\u043d\u043e\u0439 \u0440\u0430\u0431\u043e\u0442\u044b", p.capitalize() + "\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0435\u043a\u0442\u0430"),
              (u + "\u043d\u043e\u0439 \u0440\u0430\u0431\u043e\u0442\u044b", p + "\u043d\u043e\u0433\u043e \u043f\u0440\u043e\u0435\u043a\u0442\u0430"),
          ]
          endings = {
              "\u043d\u044b\u0439": "\u043d\u044b\u0439",
              "\u043d\u0430\u044f": "\u043d\u0430\u044f",
              "\u043d\u043e\u0435": "\u043d\u043e\u0435",
              "\u043d\u043e\u0433\u043e": "\u043d\u043e\u0433\u043e",
              "\u043d\u043e\u0439": "\u043d\u043e\u0439",
              "\u043d\u043e\u043c": "\u043d\u043e\u043c",
              "\u043d\u043e\u043c\u0443": "\u043d\u043e\u043c\u0443",
          }
          for old_end, new_end in endings.items():
              replacements.extend([
                  (u.capitalize() + old_end, p.capitalize() + new_end),
                  (u + old_end, p + new_end),
              ])

          allowed = {'.md', '.txt', '.js', '.html', '.json'}
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() not in allowed:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          print('Changed files:')
          print('\n'.join(changed) if changed else 'none')
          PY
      - name: Commit project terminology changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete pilot terminology migration"
          git push origin HEAD:dns-pc-ai-consultant
