<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Независимый демонстрационный AI-консультант по подбору совместимого компьютера" />
  <title>AI-консультант по сборке ПК</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/public-mode.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="topbar-brand">
        <div class="topbar-logo">🖥</div>
        <div>
          <h1>AI-консультант по сборке ПК</h1>
          <p>Независимый демонстрационный прототип</p>
        </div>
      </div>
      <div class="topbar-actions">
        <span id="serviceStatus" class="service-status" title="Состояние сервиса">●</span>
        <button id="newChatButton" class="icon-button" type="button" aria-label="Новый диалог" title="Новый диалог">🔄</button>
        <button id="historyButton" class="icon-button" type="button" aria-label="История диалогов" title="История диалогов">🗂</button>
        <button id="pdfButton" class="icon-button" type="button" aria-label="Скачать PDF" title="Скачать PDF">📄</button>
      </div>
    </header>

    <section id="demoNotice" class="demo-notice" hidden></section>
    <section id="examples" class="example-prompts" aria-label="Примеры запросов"></section>
    <section id="chat" class="chat" aria-live="polite"></section>

    <form id="chatForm" class="composer">
      <textarea id="messageInput" rows="1" maxlength="4000" placeholder="Напишите бюджет, задачи и пожелания…" required></textarea>
      <button id="sendButton" type="submit">Отправить</button>
    </form>
    <p class="disclaimer">
      Цены и наличие уточняйте на DNS.ru для своего города. Проект не является официальным сервисом DNS и не оформляет заказы.
    </p>
  </main>

  <dialog id="historyDialog" class="history-dialog">
    <div class="history-panel">
      <div class="history-header">
        <h2>История диалогов</h2>
        <button id="closeHistory" class="icon-button" type="button" aria-label="Закрыть">×</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </div>
  </dialog>

  <script src="/app.js" defer></script>
</body>
</html>
